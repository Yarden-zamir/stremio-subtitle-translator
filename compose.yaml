# The kitshn deploy (https://kit.yarden-zamir.com). For local Docker with LibreTranslate, see compose.local.yaml.
#
# The app is public, so these limits keep a traffic spike inside the container:
# at worst the container slows down or restarts, and the machine and its other apps keep running.
services:
  app:
    build: .
    pull_policy: build
    environment:
      UNIX_SOCKET: ${KITSHN_DEFAULT_SOCKET}
      CACHE_DIR: /data
      # Must stay below the /data tmpfs size, which counts against mem_limit.
      CACHE_MAX_MB: "80"
      # Bun writes a transpiler cache by default, and the root file system is read-only.
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    # Limits: CPU, memory (the cache tmpfs included), open files and log size.
    cpus: 0.5
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /data:size=96m
      - /tmp:size=16m
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
