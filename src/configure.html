<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle Translator</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap");
:root {
  color-scheme: light;
  --canvas: #E4E7FF; --dots: #00000026; --surface: #FFFFFF; --raised: #F1F2FF;
  --ink: #000000; --muted: #3D3D5C; --border: #000000; --shadow-ink: #000000;
  --accent: #6C5CE7; --accent-fg: #FFFFFF; --select: #FFE14D; --select-fg: #000000;
  --error: #FF5277; --error-fg: #B0002A; --error-surface: #FFE3E9;
  --green: #7CFF8A; --yellow: #FFE14D; --pink: #FF9EB0;
  --radius: 0.25rem; --bw: 2px; --shadow: 4px 4px 0 0 var(--shadow-ink);
  --sans: "Bricolage Grotesque", system-ui, sans-serif;
  --mono: "JetBrainsMono Nerd Font Mono", "JetBrains Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --canvas: #15122B; --dots: #F3F0FF22; --surface: #262147; --raised: #1D1938;
    --ink: #F3F0FF; --muted: #BDB6E6; --border: #F3F0FF; --shadow-ink: #B9A8FF;
    --select: #6C5CE7; --select-fg: #FFFFFF; --error-fg: #FF8A8A; --error-surface: #3A1830;
  }
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0; padding: 32px 16px; font: 1rem/1.5 var(--sans); color: var(--ink);
  background-color: var(--canvas);
  background-image: radial-gradient(var(--dots) 1.2px, transparent 1.2px); background-size: 16px 16px;
}
h1 { font-weight: 800; letter-spacing: -0.01em; margin: 0; font-size: 1.8rem; }
code { font-family: var(--mono); font-size: 0.85em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 40rem; margin: 0 auto; display: grid; gap: 20px; }
.card { background: var(--surface); border: var(--bw) solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; }
.label { text-transform: uppercase; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
.sticker {
  display: inline-block; padding: 0 6px; line-height: 1.5; white-space: nowrap; font-size: 0.72rem; font-weight: 800;
  letter-spacing: 0.04em; text-transform: uppercase; color: #000; background: var(--yellow);
  border: var(--bw) solid var(--shadow-ink); border-radius: 4px; box-shadow: 2px 2px 0 0 var(--shadow-ink); transform: rotate(-3deg);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; cursor: pointer; text-decoration: none;
  font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--ink); background: var(--surface);
  border: var(--bw) solid var(--border); border-radius: var(--radius); transition: transform 80ms, box-shadow 80ms;
}
.btn:not([aria-disabled="true"]):hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--shadow-ink); }
.btn:not([aria-disabled="true"]):active { transform: translate(3px, 3px); box-shadow: none; }
.btn[aria-disabled="true"] { opacity: 0.55; cursor: default; pointer-events: none; }
.btn.send { background: linear-gradient(135deg, #6C5CE7 0%, #FF5277 100%); color: #FFF; box-shadow: 3px 3px 0 0 var(--shadow-ink); }
.seg { display: inline-flex; flex-wrap: wrap; overflow: hidden; background: var(--surface); border: var(--bw) solid var(--border); border-radius: var(--radius); justify-self: start; }
.seg button { font: inherit; font-weight: 800; padding: 4px 14px; cursor: pointer; border: 0; background: transparent; color: var(--ink); }
.seg button + button { border-left: var(--bw) solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--select); color: var(--select-fg); }
.seg button:focus-visible { outline-offset: -4px; }
.field { font: inherit; color: var(--ink); background: var(--surface); padding: 4px 10px; border: var(--bw) solid var(--border); border-radius: var(--radius); min-height: 2rem; width: 100%; }
.field::placeholder { color: var(--muted); opacity: 1; }
.langs { max-height: 18rem; overflow: auto; display: grid; gap: 2px; padding: 4px; border: var(--bw) solid var(--border); border-radius: var(--radius); background: var(--raised); }
.lang { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; cursor: pointer; font: inherit; font-weight: 600; text-align: left; color: var(--ink); background: none; border: 0; border-radius: 4px; }
.lang:hover, .lang:focus-visible { background: var(--surface); outline: none; }
.lang[aria-pressed="true"] { background: var(--select); color: var(--select-fg); border-left: 8px solid var(--shadow-ink); }
.lang small { color: inherit; opacity: 0.75; font-weight: 400; }
.url { font-family: var(--mono); font-size: 0.8rem; word-break: break-all; padding: 8px; background: var(--raised); border: var(--bw) solid var(--border); border-radius: var(--radius); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.error { color: var(--error-fg); background: var(--error-surface); border: var(--bw) solid var(--error); border-radius: var(--radius); padding: 8px; margin: 0; }
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); width: max-content; max-width: 18rem;
  transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity 120ms; padding: 4px 8px; z-index: 50;
  font: 600 0.8rem/1.35 var(--sans); color: var(--ink); background: var(--surface);
  border: var(--bw) solid var(--border); border-radius: var(--radius); box-shadow: 3px 3px 0 0 var(--shadow-ink);
}
[data-tip]:hover::after { opacity: 1; transition-delay: 300ms; }
[data-tip]:focus-visible::after { opacity: 1; transition-delay: 0ms; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="row"><h1>Subtitle translator</h1><span class="sticker" data-tip="This page makes an install link. Nothing is saved on the server.">Stremio addon</span></div>
    <p class="muted">Translates the English subtitle that Stremio would pick for a video into your language.</p>
  </div>

  <div class="card">
    <span class="label">Translation provider</span>
    <div class="seg" id="providers" role="group" aria-label="Translation provider"></div>
    <p class="muted" id="provider-note"></p>
  </div>

  <div class="card">
    <span class="label">Target language</span>
    <input class="field" id="filter" type="search" placeholder="Filter languages" aria-label="Filter languages" autocomplete="off">
    <div class="langs" id="langs" role="group" aria-label="Target language"></div>
  </div>

  <div class="card">
    <span class="label">Install</span>
    <div class="url" id="url">Choose a language first.</div>
    <div class="row">
      <a class="btn send" id="install" aria-disabled="true" data-tip="Opens the Stremio app and installs the addon.">Install in Stremio</a>
      <a class="btn" id="web" aria-disabled="true" target="_blank" rel="noopener" data-tip="Installs the addon in Stremio Web, in a new tab.">Install in Stremio Web</a>
      <button class="btn" id="copy" type="button" data-tip="Copies the manifest URL. Paste it in Stremio under Addons, then the search field.">Copy URL</button>
    </div>
  </div>
</main>
<script type="module">
const $ = (id) => {
  const element = document.getElementById(id);
  if (!element) throw new Error(`Missing #${id}`);
  return element;
};

function decodeConfig(segment) {
  try {
    const base64 = segment.replaceAll("-", "+").replaceAll("_", "/");
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(base64), (c) => c.charCodeAt(0))));
  } catch {
    return {};
  }
}

function encodeConfig(config) {
  const bytes = new TextEncoder().encode(JSON.stringify(config));
  return btoa(String.fromCharCode(...bytes)).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
}

const segments = location.pathname.split("/").filter(Boolean);
const current = segments.length === 2 ? decodeConfig(segments[0]) : {};
const response = await fetch("/api/options");
if (!response.ok) throw new Error(`/api/options returned ${response.status}`);
const { providers } = await response.json();

const state = {
  provider: providers.find((p) => p.id === current.provider)?.id ?? providers[0].id,
  lang: current.lang ?? null,
};

function selectedProvider() {
  return providers.find((p) => p.id === state.provider);
}

function renderProviders() {
  const container = $("providers");
  container.replaceChildren(...providers.map((provider) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = provider.label;
    button.setAttribute("aria-pressed", String(provider.id === state.provider));
    button.dataset.tip = `Translate with ${provider.label}.`;
    button.addEventListener("click", () => { state.provider = provider.id; render(); });
    return button;
  }));
  const provider = selectedProvider();
  const note = $("provider-note");
  note.className = provider.error ? "error" : "muted";
  note.textContent = provider.error ?? `${provider.languages.length} languages available.`;
}

function renderLanguages() {
  const filter = $("filter").value.trim().toLowerCase();
  const visible = selectedProvider().languages.filter((language) =>
    !filter || [language.name, language.nativeName, language.code].some((text) => text.toLowerCase().includes(filter)));
  $("langs").replaceChildren(...visible.map((language) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "lang";
    button.setAttribute("aria-pressed", String(language.code === state.lang));
    button.innerHTML = `<span></span><small></small>`;
    button.children[0].textContent = language.name;
    button.children[1].textContent = `${language.nativeName} · ${language.code}`;
    button.addEventListener("click", () => { state.lang = language.code; render(); });
    return button;
  }));
}

function renderInstall() {
  const supported = selectedProvider().languages.some((language) => language.code === state.lang);
  const manifestUrl = supported ? `${location.origin}/${encodeConfig({ lang: state.lang, provider: state.provider })}/manifest.json` : null;
  $("url").textContent = manifestUrl ?? "Choose a language first.";
  for (const [id, href] of [
    ["install", manifestUrl && manifestUrl.replace(location.protocol, "stremio:")],
    ["web", manifestUrl && `https://web.stremio.com/#/addons?addon=${encodeURIComponent(manifestUrl)}`],
  ]) {
    const link = $(id);
    link.setAttribute("aria-disabled", String(!href));
    if (href) link.href = href; else link.removeAttribute("href");
  }
  $("copy").onclick = manifestUrl ? () => navigator.clipboard.writeText(manifestUrl) : null;
}

function render() {
  renderProviders();
  renderLanguages();
  renderInstall();
}

$("filter").addEventListener("input", renderLanguages);
render();
</script>
</body>
</html>
